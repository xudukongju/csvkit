name: Verify csvstat count
on: push
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install '.[test]'
      - run: pytest -q tests/test_utilities/test_csvstat.py
